name: Publish sanitized snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: JSD-IT/Roadmap
      TARGET_DEFAULT_BRANCH: main
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      TARGET_HOST: ${{ secrets.TARGET_HOST != '' && secrets.TARGET_HOST || 'github.com' }}

    steps:
      - name: Validate target configuration
        run: |
          set -euo pipefail
          test -n "$TARGET_REPO_PAT" || { echo 'TARGET_REPO_PAT is missing' >&2; exit 1; }
          [[ "$TARGET_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid TARGET_HOST' >&2; exit 1; }
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid TARGET_REPO' >&2; exit 1; }

      - name: Checkout current protected revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build history-free sanitized repository
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/sanitized-snapshot"
          mkdir -p "$snapshot"
          git archive HEAD | tar -x -C "$snapshot"
          rm -rf "$snapshot/.github/workflows"
          find "$snapshot" -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '.env' -o -name '.env.*' \) ! -name '.env.example' -delete
          cd "$snapshot"
          git init --initial-branch="$TARGET_DEFAULT_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Sanitized snapshot of ${GITHUB_SHA}"

      - name: Push sanitized snapshot
        env:
          GIT_PASSWORD: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/sanitized-snapshot"
          askpass="$RUNNER_TEMP/git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s" "x-access-token";; *) printf "%s" "$GIT_PASSWORD";; esac' > "$askpass"
          chmod 700 "$askpass"
          cd "$snapshot"
          git remote add mirror "https://${TARGET_HOST}/${TARGET_REPO}.git"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push --force mirror "HEAD:refs/heads/${TARGET_DEFAULT_BRANCH}"
