name: Branch Security Build

on:
  push:
    branches:
      - 'feature/**'
      - 'features/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test untrusted branch code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: test
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-not-a-secret-00000000000000000000000000000000
      INTERNAL_API_SECRET: ci-only-not-a-secret-11111111111111111111111111111111

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Type-check
        run: yarn tsc --noEmit

      - name: Lint
        run: yarn lint --max-warnings 100

      - name: Run security regression tests
        run: yarn test:security

      - name: Audit runtime dependencies
        run: yarn audit --groups dependencies --level low

      - name: Build production bundle
        env:
          NODE_ENV: production
        run: yarn build

      - name: Enforce performance budgets
        run: yarn perf:budget
